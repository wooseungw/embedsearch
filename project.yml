# XcodeGen spec for the EmbedSearch launcher app (App track).
# Generate with `xcodegen generate`; the .xcodeproj is gitignored. See scripts/build-app.sh.
name: EmbedSearch

options:
  bundleIdPrefix: com.seungwoo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Ad hoc so a fresh clone builds without an Apple account; scripts/build-app.sh signs with
    # your Apple Development identity (and hardened runtime) when the keychain has one.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  EmbedSearchPackage:
    path: .
  # Updates: checks the latest GitHub release's appcast.xml, made by scripts/make-appcast.sh.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"

targets:
  EmbedSearch:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Tests/**"
      # opendataloader-pdf (Apache-2.0) with its license files; fetched by scripts/fetch-opendataloader.sh.
      - path: vendor/opendataloader
        type: folder
        buildPhase: resources
    dependencies:
      - package: EmbedSearchPackage
        product: SearchCore
      - package: EmbedSearchPackage
        product: EmbedCore
      - package: EmbedSearchPackage
        product: EmbedMLX
      - package: Sparkle
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: EmbedSearch
        CFBundleName: EmbedSearch
        CFBundleShortVersionString: "0.3.2"
        # Sparkle compares this, not the short version: raise it with every release.
        CFBundleVersion: "5"
        CFBundleDevelopmentRegion: ko
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Seungwoo"
        NSAppleEventsUsageDescription: "다크 모드 전환, 휴지통 비우기 같은 시스템 명령을 실행하려면 System Events/Finder 제어 권한이 필요합니다."
        CFBundleURLTypes:
          - CFBundleURLName: com.seungwoo.embedsearch
            CFBundleURLSchemes:
              - embedsearch
        # Checks daily, downloads silently and installs when the app quits; asks every 7 days while a
        # downloaded update waits. SUPublicEDKey verifies the dmg; its private key is in the publisher's keychain.
        SUFeedURL: https://github.com/wooseungw/embedsearch/releases/latest/download/appcast.xml
        SUPublicEDKey: 7944c9nh3Xctw+8Lg9LxHPAHtDtJH8LlUHjVM8mPevA=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: App/Resources/EmbedSearch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seungwoo.embedsearch
        PRODUCT_NAME: EmbedSearch
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  # Unit tests for the query/IME controller logic. Not hosted: compiles the controller sources
  # directly so the tests never launch the agent app (which would grab the global hotkey).
  EmbedSearchAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
      - path: App/Search/QueryController.swift
      - path: App/Search/EngineStateText.swift
      - path: App/Actions/Shell.swift
      - path: App/Settings/AppSettings.swift
      - path: App/Hotkey/KeyCombo.swift
      - path: App/Panel/LauncherFieldEditor.swift
      - path: App/Panel/PanelLayout.swift
      - path: App/Preview/PageMatch.swift
      - path: App/Clipboard/ClipboardHistory.swift
      - path: App/Dev/MockSearchService.swift
      - path: App/Dev/MockCatalog.swift
    dependencies:
      - package: EmbedSearchPackage
        product: SearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seungwoo.embedsearch.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EmbedSearch:
    build:
      targets:
        EmbedSearch: all
        EmbedSearchAppTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "--show": true
    test:
      config: Debug
      targets:
        - EmbedSearchAppTests
    archive:
      config: Release
  # Tests only (no MLX build): arch -arm64 xcodebuild test -scheme EmbedSearchAppTests ...
  EmbedSearchAppTests:
    build:
      targets:
        EmbedSearchAppTests: [test]
    test:
      config: Debug
      targets:
        - EmbedSearchAppTests
